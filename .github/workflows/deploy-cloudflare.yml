name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p dist/zh-TW dist/data
          cp index.html dist/index.html
          cp zh-TW/index.html dist/zh-TW/index.html
          cp data/journals-seed.json dist/data/journals-seed.json
          cp favicon.svg og.png dist/
          # Pages Functions must sit at the root of the deployed directory.
          cp -R functions dist/functions

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create submission-desk --production-branch=main 2>/dev/null \
            || echo "Pages project already exists — continuing."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=submission-desk --branch=main
